<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
</head>
<body>
  <h1>Inscription</h1>
  <form id="signupForm">
    <input type="text" placeholder="Nom" name="nom" required><br>
    <input type="email" placeholder="Email" name="email" required><br>
    <input type="password" placeholder="Mot de passe" name="mot_de_passe" required><br>
    <button type="submit">S'inscrire</button>
  </form>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const data = {
        nom: form.nom.value,
        email: form.email.value,
        mot_de_passe: form.mot_de_passe.value
      };

      const res = await fetch("http://localhost:5000/api/users/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });

      const result = await res.json();
      console.log(result);
      alert(result.message || "Inscription réussie");
    });
  </script>
</body>
</html>
